# Modèle — Web App for Containers + ACR admin + publish profile.
# Prérequis :
#   - ACR admin activé ; secrets ACR_USERNAME / ACR_PASSWORD
#   - secret AZURE_WEBAPP_PUBLISH_PROFILE (publish profile XML, jamais affiché)
#   - variables ACR_LOGIN_SERVER, WEBAPP_NAME, IMAGE_NAME
#   - Web App configurée avec WEBSITES_PORT = port du conteneur
#   - health check plateforme sur /api/health (liveness)
name: Deploy Web App for Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-webapp-container
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:latest
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for readiness
        shell: bash
        run: |
          url="https://${{ vars.WEBAPP_NAME }}.azurewebsites.net/api/ready"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then
              echo "readiness OK"
              exit 0
            fi
            echo "attente readiness ($i/30)"
            sleep 10
          done
          echo "readiness KO"
          exit 1
