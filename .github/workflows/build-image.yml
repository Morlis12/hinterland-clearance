name: Build and push image

# Ce workflow construit et pousse l'image dans ACR. Le déploiement vers
# Azure Container Apps est volontairement manuel après validation :
#   az containerapp update -g rgci-aglci-ai -n aglci-overdue \
#     --image aglcioverdueacr.azurecr.io/overdue-files:<sha> \
#     --revision-suffix <sha-court>

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'overdue-files' }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'aglcioverdueacr.azurecr.io' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate ACR configuration
        run: |
          test -n "$ACR_LOGIN_SERVER" || { echo "Variable ACR_LOGIN_SERVER manquante"; exit 1; }
          test -n "$IMAGE_NAME" || { echo "Variable IMAGE_NAME manquante"; exit 1; }

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
